{% extends "base.html" %}
{% block content %}
<style>
.contact-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    color: #333;
}
.contact-page h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    color: #1a1a1a;
}
.contact-page p {
    line-height: 1.7;
    margin-bottom: 20px;
}
.contact-details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}
.contact-item {
    background: #f8f9fb;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e3e6ea;
}
.contact-item h2 {
    margin-top: 0;
    font-size: 1.3rem;
    color: #2a5d84;
}
.contact-form {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid #dee2e6;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
}
.form-group {
    margin-bottom: 18px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}
.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ced4da;
    border-radius: 8px;
    font-size: 0.95rem;
}
.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #7aaef8;
    box-shadow: 0 0 0 3px rgba(122, 174, 248, 0.16);
}
button[type="submit"] {
    display: inline-block;
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 14px 26px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease;
}
button[type="submit"]:hover {
    background: #155abc;
}
@media (max-width: 640px) {
    .contact-page {
        padding: 24px 16px;
    }
    .contact-form {
        padding: 24px;
    }
}
</style>
<div class="contact-page">
    <h1>Contact Us</h1>
    <p>If you have questions, feedback, or need help, please reach out to us.</p>

    <div class="contact-details">
        <div class="contact-item">
            <h2>Customer Support</h2>
            <p>Email: support@brokart.com</p>
            <p>Phone: +1 (800) 123-4567</p>
        </div>
        <div class="contact-item">
            <h2>Visit Us</h2>
            <p>123 Brokart Avenue</p>
            <p>City, State, ZIP</p>
        </div>
    </div>

    <form class="contact-form" method="post" action="/contact/">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
</div>
{% endblock %}
